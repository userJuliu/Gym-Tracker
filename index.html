<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Cloud Tracker</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 1rem; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #1e293b; }
    header h1 { font-size: 1.8rem; font-weight: 800; color: #818cf8; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    header p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.3rem; }

    .tabs-nav { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1.5rem; scrollbar-width: thin; }
    .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 0.6rem 1rem; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .tab-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

    .exercise-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 1.2rem; margin-bottom: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid #334155; }
    .exercise-title { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
    .exercise-stats-badge { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; padding: 0.3rem 0.6rem; border-radius: 6px; background: #0f172a; font-weight: 600; border: 1px solid #334155; }

    .trend-up { color: #34d399; }
    .trend-down { color: #f87171; }
    .trend-same { color: #fbbf24; }

    .set-input-row { display: grid; grid-template-columns: 1fr 1fr 1.2fr 1fr; gap: 0.8rem; margin-bottom: 1rem; align-items: center; }
    .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .input-group label { font-size: 0.7rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    
    input, select { background: #0f172a !important; border: 1px solid #475569 !important; color: #f8fafc !important; padding: 0.6rem; border-radius: 8px; font-size: 0.9rem; width: 100%; outline: none; }
    input:focus, select:focus { border-color: #6366f1 !important; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

    .btn-save { background: #6366f1; color: #fff; border: none; padding: 0.7rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; width: 100%; justify-content: center; transition: background 0.2s; }
    .btn-save:hover { background: #4f46e5; }

    .history-list { margin-top: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.6rem; }
    .history-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
    .history-item:last-child { border-bottom: none; }
    .chart-box { margin-top: 1rem; height: 180px; position: relative; }

    .sync-status { margin-top: 1.5rem; text-align: center; background: #1e293b; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.5rem; color: #cbd5e1; cursor: pointer; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; }
    .dot.connected { background: #34d399; }

    @media (max-width: 700px) {
      .set-input-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i data-lucide="cloud"></i> Gym Cloud Tracker</h1>
      <p>Geräteübergreifender Sync</p>
    </header>

    <div class="tabs-nav" id="tabsNav"></div>
    <div id="exerciseContent"></div>
    
    <div style="text-align: center;">
      <div class="sync-status" onclick="loadFromCloud()" title="Klicken zum manuellen Aktualisieren">
        <div id="syncDot" class="dot"></div>
        <span id="syncText">Verbinde Cloud... (Klicken zum Aktualisieren)</span>
      </div>
    </div>
  </div>

  <script>
    // DEINE ZUGANGSDATEN HIER EINTRAGEN
    const JSONBIN_API_KEY = "$2a$10$/12s8Z7UYyCY3FEk6rWj.efvZML4es8PBx0u.nxDFWBIY7x4uB5j0"; 
    const JSONBIN_BIN_ID = "6adde7bbac6210605a509178";

    let cloudData = {};
    let currentDayIndex = 0;
    let charts = {};

    function getTodayISO() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    async function loadFromCloud() {
      document.getElementById('syncText').innerText = 'Lade Cloud-Daten...';
      try {
        // Nutzung der offiziellen Lese-Methode über JSONbin API
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          method: 'GET',
          headers: { 
            'X-Master-Key': JSONBIN_API_KEY,
            'Content-Type': 'application/json'
          }
        });
        if (!res.ok) throw new Error("Netzwerkfehler");
        const data = await res.json();
        cloudData = data.record.exercises || {};
        
        document.getElementById('syncDot').classList.add('connected');
        document.getElementById('syncText').innerText = 'Cloud Verbunden & Synchronisiert';
        renderExercises();
      } catch (e) {
        console.error(e);
        // Fallback falls Netzwerk blockiert: Lokale Daten nutzen, damit die App nutzbar bleibt
        document.getElementById('syncText').innerText = 'Offline-Modus (Klicken zum Verbinden)';
        cloudData = JSON.parse(localStorage.getItem('gym_tracker_logs')) || {};
        renderExercises();
      }
    }

    async function saveToCloud() {
      localStorage.setItem('gym_tracker_logs', JSON.stringify(cloudData));
      document.getElementById('syncDot').classList.remove('connected');
      document.getElementById('syncText').innerText = 'Speichere...';

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify({ exercises: cloudData })
        });
        if (!res.ok) throw new Error("Speicherfehler");

        document.getElementById('syncDot').classList.add('connected');
        document.getElementById('syncText').innerText = 'Gespeichert & Synchronisiert';
      } catch (e) {
        console.error(e);
        document.getElementById('syncText').innerText = 'Speicherfehler';
      }
    }

    const workoutPlan = [
      {
        id: "day1",
        title: "Mo: Push A (Brust & Trizeps)",
        exercises: ["Bankdrücken Langhantel", "Bankdrücken schräg Kurzhantel", "Dips / Dipsmaschine", "Arnold Press sitzend", "Trizepsstrecken überkopf Kabelzug", "Spider Curls Schrägbank"]
      },
      {
        id: "day2",
        title: "Di: Bauch & Arm-Spezial",
        exercises: ["Unterarmstütz / Bauchmaschine", "Rumpfbeugen seitlich Kabelzug", "Bizepscurls einarmig Kabelzug", "Trizepsstrecken liegend Kurzhantel", "Unterarm Maschine", "Butterfly Maschine"]
      },
      {
        id: "day3",
        title: "Do: Pull & Schultern",
        exercises: ["Ruderzug Maschine", "Klimmzüge Untergriff / Latzug", "Seitheben Maschine / Kurzhantel", "Facepulls", "Bizepscurls Hammergriff sitzend", "Trizepsstrecken einarmig Kabelzug"]
      },
      {
        id: "day4",
        title: "Fr: Oberkörper Hypertrophie",
        exercises: ["Bankdrücken schräg Multipresse", "Rudern Schrägbank Kurzhantel", "Brustpresse Maschine", "Seitheben Schrägbank Kurzhantel", "Trizepsstrecken Kabelzug Stange", "Konzentrationscurl einarmig"]
      },
      {
        id: "day5",
        title: "Sa: Beine & Bauch",
        exercises: ["Beinpresse 45 Grad / Kniebeuge", "Beinstrecker Maschine", "Beinbeuger sitzend Maschine", "Wadenheben stehend Multipresse", "Crunch Kabelzug", "Klappmesser / Reverse Crunches", "Russian Twists Kurzhantel"]
      }
    ];

    function renderTabs() {
      const nav = document.getElementById('tabsNav');
      nav.innerHTML = workoutPlan.map((day, idx) => `
        <button class="tab-btn ${idx === currentDayIndex ? 'active' : ''}" onclick="switchTab(${idx})">${day.title}</button>
      `).join('');
    }

    function switchTab(index) {
      currentDayIndex = index;
      renderTabs();
      renderExercises();
    }

    function renderExercises() {
      const container = document.getElementById('exerciseContent');
      const day = workoutPlan[currentDayIndex];
      const todayStr = getTodayISO();

      container.innerHTML = day.exercises.map((exName, exIdx) => {
        const history = cloudData[exName] || [];
        const lastEntry = history[history.length - 1];
        const prevEntry = history[history.length - 2];

        let trendHtml = '<span class="trend-same">➖ Erstes Training</span>';
        if (lastEntry && prevEntry) {
          if (lastEntry.weight > prevEntry.weight) {
            trendHtml = `<span class="trend-up">📈 +${(lastEntry.weight - prevEntry.weight).toFixed(1)}kg</span>`;
          } else if (lastEntry.weight < prevEntry.weight) {
            trendHtml = `<span class="trend-down">📉 -${(prevEntry.weight - lastEntry.weight).toFixed(1)}kg</span>`;
          } else {
            trendHtml = `<span class="trend-same">🟡 Gleich</span>`;
          }
        }

        return `
          <div class="exercise-card">
            <div class="exercise-header">
              <span class="exercise-title">${exName}</span>
              <div class="exercise-stats-badge">${trendHtml}</div>
            </div>

            <div class="set-input-row">
              <div class="input-group">
                <label>Gewicht (kg)</label>
                <input type="number" step="0.5" id="weight_${exIdx}" placeholder="z.B. 60" value="${lastEntry ? lastEntry.weight : ''}">
              </div>
              <div class="input-group">
                <label>Wdh.</label>
                <input type="number" id="reps_${exIdx}" placeholder="z.B. 10" value="${lastEntry ? lastEntry.reps : ''}">
              </div>
              <div class="input-group">
                <label>Datum</label>
                <input type="date" id="date_${exIdx}" value="${todayStr}">
              </div>
              <div class="input-group">
                <label>Anstrengung</label>
                <select id="rpe_${exIdx}">
                  <option value="Leicht">🟢 Leicht</option>
                  <option value="Optimal" selected>🟡 Optimal (RPE 8-9)</option>
                  <option value="Maximal">🔴 Versagen (RPE 10)</option>
                </select>
              </div>
            </div>

            <button class="btn-save" onclick="saveSet('${exName}', ${exIdx})">
              <i data-lucide="cloud-upload"></i> Satz Speichern
            </button>

            ${history.length > 0 ? `
              <div class="history-list">
                <div style="font-size:0.75rem; color:#94a3b8; font-weight:700; margin-bottom:0.4rem;">VERLAUF:</div>
                ${history.slice(-3).reverse().map(h => `
                  <div class="history-item">
                    <span>${h.date}</span>
                    <span><strong>${h.weight} kg</strong> × ${h.reps} Wdh.</span>
                    <span style="color:#94a3b8;">${h.rpe}</span>
                  </div>
                `).join('')}
              </div>
              <div class="chart-box"><canvas id="chart_${exIdx}"></canvas></div>
            ` : ''}
          </div>
        `;
      }).join('');

      lucide.createIcons();
      initCharts();
    }

    function saveSet(exName, exIdx) {
      const weight = parseFloat(document.getElementById(`weight_${exIdx}`).value);
      const reps = parseInt(document.getElementById(`reps_${exIdx}`).value);
      const rawDate = document.getElementById(`date_${exIdx}`).value;
      const rpe = document.getElementById(`rpe_${exIdx}`).value;

      if (!weight || !reps) {
        alert("Bitte Gewicht und Wiederholungen eintragen!");
        return;
      }

      let formattedDate = rawDate;
      if (rawDate) {
        const parts = rawDate.split('-');
        if (parts.length === 3) {
          formattedDate = `${parts[2]}.${parts[1]}.`;
        }
      }

      const newRecord = {
        date: formattedDate,
        weight: weight,
        reps: reps,
        rpe: rpe
      };

      if (!cloudData[exName]) cloudData[exName] = [];
      cloudData[exName].push(newRecord);

      saveToCloud();
      renderExercises();
    }

    function initCharts() {
      const day = workoutPlan[currentDayIndex];
      day.exercises.forEach((exName, exIdx) => {
        const history = cloudData[exName] || [];
        if (history.length === 0) return;
        const ctx = document.getElementById(`chart_${exIdx}`);
        if (!ctx) return;
        if (charts[exIdx]) charts[exIdx].destroy();

        charts[exIdx] = new Chart(ctx, {
          type: 'line',
          data: {
            labels: history.map(h => h.date),
            datasets: [{
              label: 'Gewicht (kg)',
              data: history.map(h => h.weight),
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.15)',
              fill: true,
              tension: 0.3,
              borderWidth: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11 } } },
              y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 11 } } }
            }
          }
        });
      });
    }

    renderTabs();
    loadFromCloud();
  </script>
</body>
</html>
